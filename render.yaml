# Render Blueprint. Free plan: the service sleeps when idle and its SQLite file
# resets on redeploy (feeds refill it within seconds). For a persistent, always-on
# service, switch plan to "starter" and uncomment the disk block.
services:
  - type: web
    name: drift-news
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATA_DIR
        value: /var/data
    # disk:
    #   name: drift-data
    #   mountPath: /var/data
    #   sizeGB: 1
