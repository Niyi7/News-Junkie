<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift – news</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0b22;--fg:#f6efe3;--mute:#a9a0c9;--line:rgba(246,239,227,.14);--card:rgba(255,255,255,.04);--acc:#ffb48a;--accfg:#2a1c5c;--grain:.06;
--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fbf5ee;--fg:#2a1c5c;--mute:#6b5f9e;--line:rgba(42,28,92,.15);--card:rgba(42,28,92,.035);--acc:#cf5428;--accfg:#fff;--grain:.045;color-scheme:light}}
:root[data-theme="light"]{--bg:#fbf5ee;--fg:#2a1c5c;--mute:#6b5f9e;--line:rgba(42,28,92,.15);--card:rgba(42,28,92,.035);--acc:#cf5428;--accfg:#fff;--grain:.045;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.5 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:var(--grain);background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;max-width:640px;margin:0 auto;padding:0 16px 96px}
.hero{position:relative;padding:22px 0 8px}
.sky{position:absolute;left:-16px;right:-16px;top:-40px;height:300px;overflow:hidden;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.sky i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.5}
.sky i:nth-child(1){width:70%;aspect-ratio:1;left:-10%;top:-20%;background:radial-gradient(circle,#f48fb1,transparent 65%);animation:d1 40s ease-in-out infinite alternate}
.sky i:nth-child(2){width:60%;aspect-ratio:1;right:-15%;top:0;background:radial-gradient(circle,#3fd0c9,transparent 65%);animation:d2 52s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(30%,20%) scale(1.2)}}@keyframes d2{to{transform:translate(-30%,10%) scale(.9)}}
h1{font:700 clamp(44px,13vw,68px)/1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.03em;font-variation-settings:"opsz" 144;animation:up .5s var(--ease) both}
.tag{margin:6px 0 0;color:var(--mute);font-size:15px;animation:up .5s .08s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -16px;padding:10px 16px 8px;background:var(--bg);border-bottom:1px solid var(--line);transition:transform .25s var(--ease)}
header.hide{transform:translateY(-110%)}
.bar{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:var(--card);transition:border-color .2s}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mute)}
.btn{min-height:44px;border:1px solid var(--line);background:var(--card);color:inherit;font:500 14px Figtree,sans-serif;border-radius:14px;padding:0 14px;cursor:pointer;transition:background .2s,color .2s}
.btn.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}#chips::-webkit-scrollbar{display:none}
.chip{--h:260;flex:none;min-height:36px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:none;color:inherit;font:500 13px Figtree,sans-serif;border-radius:99px;padding:0 14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip i{width:7px;height:7px;border-radius:50%;background:hsl(var(--h) 85% 62%)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
#list{padding-top:14px}
.item{display:block;width:100%;text-align:left;color:inherit;font:inherit;background:none;border:0;cursor:pointer;animation:up .3s var(--ease) both;animation-delay:calc(var(--n)*40ms)}
.row{display:grid;grid-template-columns:1fr 88px;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.cv{overflow:hidden;background:#1b1340}.cv{position:relative}.cv svg{display:block;width:100%;height:100%}.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row .cv{width:88px;height:88px;border-radius:18px}
.m{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);min-height:24px}
.m b{font-weight:600;color:var(--fg);display:flex;align-items:center;gap:6px}
.m b i{width:7px;height:7px;border-radius:50%;background:hsl(var(--h) 85% 62%);flex:none}
.hd{font:600 19px/1.25 Fraunces,Georgia,serif;margin:4px 0 0;font-variation-settings:"opsz" 48;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.star{margin-left:auto;background:none;border:0;color:var(--mute);font-size:20px;min-width:44px;min-height:44px;margin-top:-10px;margin-bottom:-10px;margin-right:-12px;cursor:pointer;transition:transform .2s var(--ease),color .2s}
.star.on{color:var(--acc)}.star:active{transform:scale(1.35)}
.live{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 9px transparent}}
.big{position:relative;border-radius:28px;overflow:hidden;min-height:clamp(280px,70vw,380px);display:flex;align-items:flex-end;border:1px solid var(--line)}
.big .cv{position:absolute;inset:0;border-radius:0}
.big .tx{position:relative;width:100%;padding:90px 20px 18px;background:linear-gradient(transparent,rgba(8,5,20,.9));color:#f6efe3}
.big .m,.big .m b{color:#f6efe3}.big .m{opacity:.9}.big .star{color:#e8dff5}.big .star.on{color:#ffb48a}
.big .hd{font-size:clamp(28px,8.4vw,42px);line-height:1.08;-webkit-line-clamp:5;font-weight:700;letter-spacing:-.01em;margin-top:8px}
.big-wrap{padding-bottom:6px}
.empty{text-align:center;color:var(--mute);padding:60px 10px}
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:none;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#reader.on{display:block}
#reader .top{position:absolute;z-index:2;left:12px;top:calc(12px + env(safe-area-inset-top,0px))}
#reader .cv{height:42vh;min-height:240px}
#reader .body{max-width:640px;margin:0 auto;padding:18px 20px}
#reader .hd{font-size:clamp(28px,8vw,38px);line-height:1.12;display:block;-webkit-line-clamp:unset;margin:10px 0 16px}
#reader p{font-size:18px;line-height:1.6;margin:0 0 24px}
#reader a.go{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:99px;background:var(--acc);color:var(--accfg);font-weight:600;text-decoration:none}
::view-transition-group(*){animation-duration:.32s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.item{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div class="sky"><i></i><i></i></div><h1 id="title">Drift</h1><p class="tag">Today’s stories, floating by.</p></div>
  <header id="hdr">
    <div class="bar">
      <label class="search"><span aria-hidden="true">☾</span><input id="q" type="search" placeholder="Search stories" aria-label="Search stories"></label>
      <button id="saved" class="btn" aria-label="Show saved stories">★ Saved</button>
    </div>
    <div id="chips"></div>
  </header>
  <div id="list"></div>
  <div id="empty" class="empty" style="display:none"></div>
</div>
<div id="reader" role="dialog" aria-modal="true"></div>
<script>
const $=id=>document.getElementById(id);
let all=[],cat="",q="",onlySaved=false,bm=new Set(),curCard=null;
try{bm=new Set(JSON.parse(localStorage.getItem("bm")||"[]"))}catch(e){}
const saveBm=()=>{try{localStorage.setItem("bm",JSON.stringify([...bm]))}catch(e){}};
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const HUES={World:225,Business:42,Tech:175,Nigeria:140,Africa:20,Sport:320};
const hs=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const hue=c=>HUES[c]??(hs(c||"x")%360);
const rng=s=>{let t=s>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}};
const safe=u=>/^https?:\/\//i.test(u||"")?u:"#";
const age=a=>Date.now()/1000-(a.published||0);
const ago=ts=>{const s=Math.max(60,Date.now()/1000-ts);return s<3600?Math.round(s/60)+"m ago":s<86400?Math.round(s/3600)+"h ago":Math.round(s/86400)+"d ago"};
const isLive=a=>!!a.live||(a.published&&age(a)<10800);

function cover(a){
  const r=rng(hs((a.category||"")+a.id)),h=hue(a.category),u="g"+(r()*1e9|0);
  const cols=[h,(h+40+r()*40)%360,(h+300-r()*40)%360];
  let s='<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>';
  cols.forEach((c,i)=>s+=`<radialGradient id="${u}${i}"><stop offset="0" stop-color="hsl(${c} 85% 62%)"/><stop offset="1" stop-color="hsl(${c} 85% 62%)" stop-opacity="0"/></radialGradient>`);
  s+=`</defs><rect width="100" height="100" fill="hsl(${h} 45% 14%)"/>`;
  cols.forEach((c,i)=>s+=`<circle cx="${r()*100|0}" cy="${r()*100|0}" r="${45+r()*35|0}" fill="url(#${u}${i})"/>`);
  s+=`<circle cx="${30+r()*40|0}" cy="${30+r()*40|0}" r="${14+r()*18|0}" fill="none" stroke="hsl(${h} 90% 85%)" stroke-opacity=".35" stroke-width=".6"/></svg>`;
  const d=document.createElement("div");d.className="cv";d.innerHTML=s;
  if(a.image&&safe(a.image)!=="#"){const im=document.createElement("img");im.loading="lazy";im.alt="";im.referrerPolicy="no-referrer";im.src=a.image;im.onerror=()=>im.remove();d.append(im)}
  return d;
}
function meta(a,withStar){
  const m=document.createElement("div");m.className="m";m.style.setProperty("--h",hue(a.category));
  const b=document.createElement("b");const dot=document.createElement("i");b.append(dot,document.createTextNode(a.source||"Unknown source"));
  const t=document.createElement("span");t.textContent=a.published?ago(a.published):"";
  m.append(b,t);
  if(isLive(a)){const l=document.createElement("span");l.className="live";l.title="Fresh";m.append(l)}
  if(withStar){const s=document.createElement("button");s.className="star"+(bm.has(a.id)?" on":"");s.textContent="★";s.setAttribute("aria-label","Save story");
    s.onclick=ev=>{ev.stopPropagation();bm.has(a.id)?bm.delete(a.id):bm.add(a.id);saveBm();s.classList.toggle("on",bm.has(a.id))};m.append(s)}
  return m;
}
const vt=(card,on)=>{if(!card||!card.isConnected)return;card.querySelector(".cv").style.viewTransitionName=on?"scv":"";card.querySelector(".hd").style.viewTransitionName=on?"shd":""};
function openReader(a,card){
  const rd=$("reader"),cv=cover(a),top=document.createElement("button");
  top.className="btn top";top.textContent="← Back";top.onclick=closeReader;
  const body=document.createElement("div");body.className="body";
  const m=meta(a,false);const cat=document.createElement("span");cat.textContent=a.category||"";m.append(cat);
  const h=document.createElement("h2");h.className="hd";h.textContent=a.title;
  const p=document.createElement("p");p.textContent=a.summary||"";
  const l=document.createElement("a");l.className="go";l.href=safe(a.url);l.target="_blank";l.rel="noopener";l.textContent="Read at "+(a.source||"source");
  body.append(m,h,p,l);rd.replaceChildren(top,cv,body);curCard=card;
  const go=()=>{vt(card,false);cv.style.viewTransitionName="scv";h.style.viewTransitionName="shd";rd.classList.add("on");document.body.style.overflow="hidden";rd.scrollTop=0;top.focus()};
  if(document.startViewTransition&&!calm){vt(card,true);document.startViewTransition(go)}else go();
}
function closeReader(){
  const rd=$("reader");if(!rd.classList.contains("on"))return;
  const card=curCard;
  const go=()=>{rd.querySelectorAll(".cv,.hd").forEach(e=>e.style.viewTransitionName="");rd.classList.remove("on");document.body.style.overflow="";vt(card,true)};
  if(document.startViewTransition&&!calm){const t=document.startViewTransition(go);t.finished.finally(()=>vt(card,false))}else go();
}
addEventListener("keydown",e=>{if(e.key==="Escape")closeReader()});

function render(){
  const cats=["",...new Set(all.map(a=>a.category).filter(Boolean))].sort();
  $("chips").replaceChildren(...cats.map(c=>{const b=document.createElement("button");b.className="chip"+(c===cat?" on":"");b.style.setProperty("--h",c?hue(c):260);
    if(c){b.append(document.createElement("i"))}b.append(document.createTextNode(c||"All"));b.onclick=()=>{cat=c;render()};return b}));
  $("saved").classList.toggle("on",onlySaved);
  const t=q.toLowerCase();
  const rows=all.filter(a=>(!cat||a.category===cat)&&(!onlySaved||bm.has(a.id))&&(!t||(a.title+" "+(a.summary||"")+" "+(a.source||"")).toLowerCase().includes(t)));
  $("list").replaceChildren(...rows.map((a,n)=>{
    const it=document.createElement("div");it.className="item";it.style.setProperty("--n",Math.min(n,8));it.setAttribute("role","button");it.tabIndex=0;
    it.onclick=()=>openReader(a,it);it.onkeydown=e=>{if(e.key==="Enter")openReader(a,it)};
    const h=document.createElement("h2");h.className="hd";h.textContent=a.title;
    if(n===0){
      it.classList.add("big-wrap");const big=document.createElement("div");big.className="big";
      const cv=cover(a),tx=document.createElement("div");tx.className="tx";tx.append(meta(a,true),h);big.append(cv,tx);it.append(big);
    }else{
      it.classList.add("row");const l=document.createElement("div");l.append(meta(a,true),h);it.append(l,cover(a));
    }
    return it}));
  const e=$("empty");e.style.display=rows.length?"none":"block";
  e.textContent=all.length?"Nothing matches. Try another word or category.":(loaded?"No stories yet. The server is still fetching feeds, and this page retries every few seconds.":"Loading stories…");
}
$("q").oninput=e=>{q=e.target.value;render()};
$("saved").onclick=()=>{onlySaved=!onlySaved;render()};
let lastY=0;addEventListener("scroll",()=>{const y=scrollY;$("hdr").classList.toggle("hide",y>lastY&&y>160);lastY=y},{passive:true});
render();
var loaded=false,lastSig="";
async function load(){
  try{
    const r=await fetch("/api/articles?limit=100");if(!r.ok)throw new Error(r.status);
    const rows=await r.json();const sig=rows.map(a=>a.id).join();
    loaded=true;if(sig!==lastSig){lastSig=sig;all=rows.map(a=>({...a,url:a.link}));render()}
    return rows.length;
  }catch(err){console.error(err);loaded=true;render();return 0}
}
(async()=>{let n=await load();for(let i=0;i<12&&!n;i++){await new Promise(r=>setTimeout(r,5000));n=await load()}setInterval(load,300000)})();
</script>
</body>
</html>
